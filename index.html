<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC 2 Visualización de datos</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="jumbotron text-center">
        <h1>Visualización de datos: PEC 2</h1>
        <p>Mariano Francisco Chacón Fernández</p> 
    </div>

    <!-- Todo dentro de un mismo container para mantener el orden -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 mb-4">
                <img src="Stacked_bar.png" class="chart" alt="Gráfico del PIB de Europa">
            </div>
            
            <div class="col-sm-12 col-md-6">
                <!-- ASEGÚRATE QUE EN styles.css .chart TENGA UN HEIGHT (ej: height: 400px;) -->
                <div id="chart1" class="chart" style="width: 650px; height: 450px"></div>
            </div>
        </div>
    </div> <!-- Fin del container -->

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
    <!-- Apache ECharts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.0.0/echarts.min.js"></script>
    <!-- JavaScript -->
    <script src="main.js"></script>
</body>
</html>
